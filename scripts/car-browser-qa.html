<!doctype html>
<!-- Local-only interaction regression. Copy to public/__car-qa.html, run npm run dev,
     open /__car-qa.html and click Run. Remove the public copy before building.
     Pointer capture and reduced-motion preference are controlled test doubles;
     the widget, animation loop, events, physics and DOM run in the real browser. -->
<meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>Veracruz interaction regression</title>
<style>html{overflow-y:scroll}body{font:15px system-ui;background:#648596;color:#fff;margin:24px}button{min-height:44px;padding:10px}pre{white-space:pre-wrap;overflow-wrap:anywhere;max-width:650px}</style>
<h1>Veracruz interaction regression</h1><button id="run" disabled>Run interaction suite</button><pre id="results">Loading widget</pre>
<script type="module">
const nativeMatch = window.matchMedia.bind(window); let reduce = false; const listeners = new Set();
const motion = { get matches(){return reduce}, addEventListener(_,fn){listeners.add(fn)},addListener(fn){listeners.add(fn)} };
window.matchMedia = q => q.includes('prefers-reduced-motion') ? motion : nativeMatch(q);
localStorage.setItem('lj-veracruz-v1', JSON.stringify({paused:true,visible:false,height:'ride',environment:'normal'}));
const { initialize } = await import('/scripts/roaming-car.js?v=20261017-10');
initialize(); // The shipped entry point intentionally does not mount on this QA URL.
const { geometry } = await import('/scripts/car-dynamics.mjs?v=20261017-9');
const { PORTS, projectPort } = await import('/scripts/car-thrusters.mjs?v=20261017-9');
const host = document.getElementById('lucas-roaming-car'), root=host.shadowRoot;
const car=root.querySelector('.car'), boost=root.querySelector('.boost-button'), panel=root.querySelector('.garage');
// Synthetic touch dispatch cannot own a native active pointer. Only capture is stubbed.
car.setPointerCapture=()=>{}; car.hasPointerCapture=()=>false;
boost.setPointerCapture=()=>{}; boost.hasPointerCapture=()=>false;
const sleep=ms=>new Promise(r=>setTimeout(r,ms));
const check=(ok,label)=>{if(!ok)throw Error(label);results.textContent+='\nPASS '+label};
const data=()=>({...host.dataset});
const wait=async fn=>{for(let i=0;i<240;i++){if(fn())return;await sleep(50)}throw Error('Timed out: '+JSON.stringify(data()))};
function pointer(type,x,y){car.dispatchEvent(new PointerEvent(type,{pointerId:7,isPrimary:true,pointerType:'touch',button:0,clientX:x,clientY:y,bubbles:true}));}
function tap(){const r=car.getBoundingClientRect();pointer('pointerdown',r.x+r.width/2,r.y+r.height/2);pointer('pointerup',r.x+r.width/2,r.y+r.height/2)}
function boostPointer(type,x=100,y=100){boost.dispatchEvent(new PointerEvent(type,{pointerId:11,isPrimary:true,pointerType:'touch',button:0,clientX:x,clientY:y,bubbles:true}));}
const key=(el,k)=>el.dispatchEvent(new KeyboardEvent('keydown',{key:k,bubbles:true}));
const mode=name=>{key(boost,'ArrowDown');root.querySelector(`[data-environment="${name}"]`).click()};
const position=()=>({x:+host.dataset.x,y:+host.dataset.y});
const changed=(a,b)=>Math.hypot(a.x-b.x,a.y-b.y)>5;
function portAlignmentError(){
 const vehicle=root.querySelector('.vehicle'),shell=root.querySelector('.shell');
 const roll=Number(vehicle.style.transform.match(/rotateX\(([-+\deE.]+)deg\)/)?.[1]||0);
 const heave=Number(shell.style.transform.match(/translateY\(([-+\deE.]+)px\)/)?.[1]||0);
 const pose={x:+host.dataset.x,y:+host.dataset.y,angle:+host.dataset.edgeAngle,roll};
 const suspension={pitch:+host.dataset.pitch,heave},v=window.visualViewport;
 const g=geometry({width:v?.width||document.documentElement.clientWidth,height:v?.height||innerHeight,left:v?.offsetLeft||0,top:v?.offsetTop||0});
 return Math.max(...[...root.querySelectorAll('.thruster')].map(e=>{
  const port=PORTS.find(p=>p.id===e.dataset.port),p=projectPort(g,pose,suspension,port,e.dataset.side==='near'?1:-1),r=e.getBoundingClientRect();
  return Math.hypot(p.x-r.x-r.width/2,p.y-r.y-r.height/2);
 }));
}
async function throwToward(dx,dy){
 const r=car.getBoundingClientRect(),x=r.x+r.width/2,y=r.y+r.height/2;
 const cx=innerWidth*.5,cy=innerHeight*.4;
 pointer('pointerdown',x,y);pointer('pointermove',cx,cy);await sleep(130);
 pointer('pointermove',cx,cy);const inputStart=performance.now();await sleep(20);const inputMs=performance.now()-inputStart;
 pointer('pointermove',cx+dx*32,cy+dy*32);pointer('pointerup',cx+dx*32,cy+dy*32);
 const released={x:+host.dataset.horizontalVelocity,y:+host.dataset.verticalVelocity};
 const observed={left:false,right:false,up:false,down:false};let gap=Infinity,error=0;
 for(let i=0;i<150&&host.dataset.trick==='drop';i++){
  for(const side of Object.keys(observed))observed[side]||=+host.dataset['jet'+side[0].toUpperCase()+side.slice(1)]>.1;
  const box=car.getBoundingClientRect();gap=Math.min(gap,box.left,box.top,innerWidth-box.right,innerHeight-box.bottom);
  error=Math.max(error,portAlignmentError());await sleep(20);
 }
 await wait(()=>host.dataset.state==='cruising');return{observed,gap,error,released,inputMs};
}
run.onclick=async()=>{
run.disabled=true; results.textContent='Running';
try{
 if(location.search==='?walls'){
   await sleep(1000);
   for(const [dx,dy,name]of[[-1,0,'left'],[1,0,'right'],[0,-1,'up'],[0,1,'down']]){
     const sample=await throwToward(dx,dy);check(sample.observed[name]&&sample.gap>0&&sample.error<.8,name+' '+JSON.stringify(sample));
   }
   results.textContent+='\nALL PASSED';return;
 }
 await sleep(1000);
 check(host.dataset.state==='cruising'&&!car.hidden,'old paused/hidden preferences migrate to moving visible car');
 check(host.dataset.renderMode==='mesh'&&root.querySelector('.mesh').width>0,'closed mesh renderer loaded; CSS construction is invisible');
 check(getComputedStyle(root.querySelector('.vehicle')).visibility==='hidden','no duplicate CSS planes over the mesh');
 if(Math.min(innerWidth,innerHeight)<=600)check(+host.dataset.carSize<=134,'mobile car is compact while preserving its touch target');
 check(root.querySelectorAll('button').length===6&&panel.hidden,'only car + boost visible; four contextual environment options');
 check(!root.querySelector('[data-pause],[data-kneel],[data-trick],.garage-toggle'),'retired controls removed');
 check(root.querySelectorAll('.shell .thruster').length===12&&!root.querySelector('.nozzle,.afterburner'),'twelve flush ports provide independent upper/lower front and rear thrust');
 check(portAlignmentError()<.8,'smoke anchors coincide with actual body port centers');
 key(boost,'ArrowDown');const before=position();await sleep(500);
 check(!panel.hidden&&changed(before,position())&&+host.dataset.speed>90,'environment panel and keyboard focus never stop cruising');
 key(boost,'Escape');check(panel.hidden,'Escape closes settings without stopping');
 boostPointer('pointerdown');await sleep(180);boostPointer('pointermove',100,60);boostPointer('pointerup',100,60);
 check(!panel.hidden&&!boost.disabled&&host.dataset.boostKind==='','upward swipe opens modes without accidentally boosting');
 key(boost,'Escape');
 const initial=host.dataset.height;tap();await sleep(370);
 check(host.dataset.height!==initial&&host.dataset.trick==='','single touch changes height once');
 const height=host.dataset.height;tap();await sleep(90);tap();await sleep(80);
 check(host.dataset.trick==='kickflip'&&host.dataset.height===height,'double touch triggers flip without a single-tap side effect');
 check(car.classList.contains('rolling'),'volume surfaces shown only during 3D roll');
 let alignment=0;for(let i=0;i<10;i++){alignment=Math.max(alignment,portAlignmentError());await sleep(50)}
 check(alignment<.8,'ports and exhaust anchors remain aligned during pitch and 3D roll');
 await wait(()=>host.dataset.state==='cruising');await sleep(400);
 check(host.dataset.height===height&&!car.classList.contains('rolling'),'double-tap timer cleaned up and side view restored');
 const idleColor=getComputedStyle(boost).backgroundColor;
 boostPointer('pointerdown');boostPointer('pointerup');await sleep(80);
 check(!boost.disabled&&host.dataset.boostKind==='','first short boost tap waits for a possible double tap');
 boostPointer('pointerdown');boostPointer('pointerup');await sleep(50);
 check(host.dataset.trick==='kickflip'&&root.querySelector('.boost-label').textContent==='킥플립','boost button double tap triggers named kickflip');
 check(boost.dataset.skill==='kickflip'&&getComputedStyle(boost).backgroundColor!==idleColor,'kickflip has distinct persistent colour feedback');
 await wait(()=>host.dataset.state==='cruising');
 boostPointer('pointerdown');await sleep(110);boostPointer('pointerup');await sleep(80);
 check(host.dataset.boostKind===''&&!boost.disabled,'human-duration first tap remains available for double-tap arbitration');
 boostPointer('pointerdown');await sleep(110);boostPointer('pointerup');await sleep(50);
 check(host.dataset.trick==='kickflip','two 110 ms presses trigger kickflip instead of consuming the first tap as boost');
 await wait(()=>host.dataset.state==='cruising');
 boostPointer('pointerdown');boostPointer('pointerup');await sleep(350);
 check(host.dataset.boostKind==='normal'&&boost.dataset.skill==='boost','single quick boost tap fires only normal boost after the double-tap window');
 await wait(()=>!boost.disabled);
 boostPointer('pointerdown');boostPointer('pointerup');key(boost,'Escape');await sleep(350);
 check(host.dataset.boostKind==='','Escape cancels a pending quick boost');
 check([...root.querySelectorAll('.volume')].every(e=>getComputedStyle(e).visibility==='hidden'),'no 3D edges during ordinary side view');
 let r=car.getBoundingClientRect(), x=r.x+r.width/2,y=r.y+r.height/2;
 pointer('pointerdown',x,y);pointer('pointermove',innerWidth*.5,120);await sleep(100);
 pointer('pointermove',innerWidth*.5,120);await sleep(100);
 pointer('pointerup',innerWidth*.5,120);await sleep(150);
 check(host.dataset.trick==='drop'&&+host.dataset.verticalVelocity>0&&host.dataset.state==='fall','release from air falls down with accelerating gravity');
 r=car.getBoundingClientRect();x=r.x+r.width/2;y=r.y+r.height/2;
 pointer('pointerdown',x,y);pointer('pointermove',x+20,y+20);await sleep(80);pointer('pointercancel',x+20,y+20);
 check(host.dataset.trick==='drop','regrab and touch cancel recover as a gravity drop');
 await wait(()=>host.dataset.state==='cruising');
 for(const [dx,dy,name]of[[-1,0,'left'],[1,0,'right'],[0,-1,'up'],[0,1,'down']]){
  const sample=await throwToward(dx,dy);
  check(sample.observed[name]&&sample.gap>0&&sample.error<.8,'real DOM '+name+' throw fires the matching jet while body and exhaust stay clear/aligned · '+JSON.stringify(sample));
 }
 mode('normal');await sleep(1500);
 boostPointer('pointerdown');await sleep(130);
 check(panel.hidden&&+host.dataset.boostCharge>.4&&+host.dataset.boostCharge<1&&host.dataset.state==='cruising','partial hold charges visibly without opening settings or stopping');
 boostPointer('pointerup');await sleep(650);
 check(+host.dataset.acceleration/(9.81*+host.dataset.carSize/4.84)>1.5&&+host.dataset.pitch>3&&+host.dataset.particles>0,'boost acceleration in world units, nose-up and rear smoke');
 check(boost.disabled&&host.dataset.boostKind==='normal','partial charge selects ordinary boost and blocks duplicate input');
 await wait(()=>!boost.disabled);
 check(host.dataset.boostKind===''&&host.dataset.trick===''&&!boost.disabled,'ordinary boost ends without any ramp and keeps coasting');
 boostPointer('pointerdown');await sleep(200);boostPointer('pointercancel');
 check(+host.dataset.boostCharge===0&&host.dataset.boostKind==='','pointer cancellation clears charging without boosting');
 boostPointer('pointerdown');await sleep(120);boostPointer('pointermove',160,100);boostPointer('pointerup',160,100);
 check(host.dataset.boostKind===''&&+host.dataset.boostCharge===0,'dragging away cancels charge rather than firing');
 boostPointer('pointerdown');await sleep(260);
 check(+host.dataset.boostCharge===1&&root.querySelector('.boost-label').textContent==='풀차지'&&panel.hidden,'full charge has explicit ready feedback and never opens modes');
 boostPointer('pointerup');await sleep(80);
 check(host.dataset.boostKind==='ramp'&&host.dataset.trick==='','only full charge arms a ramp after release');
 await wait(()=>host.dataset.trick==='ramp');
 check(host.dataset.trick==='ramp','full-charge boost becomes ramp jump at wall corner');
 check(root.querySelector('.boost-label').textContent==='램프 점프'&&boost.dataset.skill==='ramp'&&getComputedStyle(boost).backgroundColor!==idleColor,'ramp jump shows its own name and colour throughout flight');
 let asymmetric=false;for(let i=0;i<20;i++){asymmetric||=Math.abs(+host.dataset.frontThrust-+host.dataset.rearThrust)>.15;await sleep(100)}
 check(asymmetric,'front/rear jets balance with different timing and power');
 await wait(()=>host.dataset.state==='cruising');check(!boost.disabled,'landing restores boost and continuous driving');
 check(host.dataset.landingPhase==='absorbing','touchdown starts residual air-spring absorption');
 const impact=+host.dataset.landingImpact;let compression=0,stagger=0;for(let i=0;i<28;i++){compression=Math.max(compression,+host.dataset.frontTravel,+host.dataset.rearTravel);stagger=Math.max(stagger,Math.abs(+host.dataset.frontTravel-+host.dataset.rearTravel));await sleep(50)}
 check((impact<=.15||compression>.2)&&stagger>.15&&host.dataset.landingPhase==='','front/rear springs respond to residual impact and settle after touchdown');
 key(boost,' ');await sleep(120);key(boost,'Escape');
 boost.dispatchEvent(new KeyboardEvent('keyup',{key:' ',bubbles:true}));
 check(host.dataset.boostKind===''&&+host.dataset.boostCharge===0,'Escape cancels keyboard charge without triggering a boost');
 key(boost,'Enter');await sleep(130);boost.dispatchEvent(new KeyboardEvent('keyup',{key:'Enter',bubbles:true}));await sleep(350);
 check(host.dataset.boostKind==='normal','keyboard hold/release selects normal boost');
 await wait(()=>!boost.disabled);
 for(const name of ['sport','offroad','mud','normal']){mode(name);await sleep(80);check(host.dataset.environment===name&&host.dataset.modeTransition==='true'&&root.querySelector('.mode-banner').dataset.visible==='true','environment '+name+' starts a visible progressive transition');await sleep(1200);check(host.dataset.modeTransition==='false'&&+host.dataset.speed>0,'environment '+name+' transition completes while driving');if(name==='offroad')check(+host.dataset.heave< -3,'offroad raises the air suspension visibly');if(name==='sport')check(+host.dataset.heave>1,'sport lowers the body visibly')}
 reduce=true;listeners.forEach(fn=>fn(motion));await sleep(200);const stationary=position();await sleep(250);
 check(!changed(stationary,position())&&host.dataset.state==='reduced-motion'&&+host.dataset.particles===0,'reduced motion stops animation and clears particles');
 const low=host.dataset.height;car.click();check(host.dataset.height!==low,'accessible click still adjusts suspension with reduced motion');
 boost.click();check(host.dataset.trick==='','reduced motion skips boost stunt');
 boostPointer('pointerdown');boostPointer('pointermove',100,50);boostPointer('pointerup',100,50);
 check(!panel.hidden&&host.dataset.boostKind==='','environment swipe remains available with reduced motion');key(boost,'Escape');
 reduce=false;listeners.forEach(fn=>fn(motion));await sleep(250);
 check(host.dataset.state==='cruising','motion preference change restores driving');
 r=car.getBoundingClientRect();x=r.x+r.width/2;y=r.y+r.height/2;
 pointer('pointerdown',x,y);pointer('pointermove',innerWidth*.5,innerHeight*.4);await sleep(50);
 reduce=true;listeners.forEach(fn=>fn(motion));await sleep(80);
 check(host.dataset.state==='reduced-motion'&&host.dataset.trick==='','reduced motion during active drag clears capture and recovers');
 reduce=false;listeners.forEach(fn=>fn(motion));await sleep(80);
 const buttons=[car,boost,...root.querySelectorAll('[data-environment]')];key(boost,'ArrowDown');
 check(buttons.every(b=>{const r=b.getBoundingClientRect();return r.width>=44&&r.height>=44}),'all interactive targets at least 44 px');
 check(!document.documentElement.scrollWidth||document.documentElement.scrollWidth<=innerWidth,'no horizontal overflow');
 key(boost,'Escape');results.textContent+='\nALL PASSED';document.title='PASS · Veracruz interaction regression';
}catch(e){results.textContent+='\nFAIL '+e.stack;document.title='FAIL · Veracruz regression'}finally{run.disabled=false}
};
results.textContent='Ready';run.disabled=false;
</script>
