---
layout: compress
---
<!DOCTYPE html>
<html lang="{{ page.lang | default: 'ko' }}">
<head>

    <meta charset="utf-8">
    <meta name=viewport content="width=device-width, initial-scale=1">
    <meta name="author" content="Lucas Jang">

    {% seo %}
	<meta property="og:title" content="{% if page.title and page.title != 'Home' %}{{ page.title | escape }} · {{ site.name }}{% else %}{{ site.name }}{% endif %}">
	<meta property="og:description" content="{% if page.description %}{{ page.description }}{% elsif page.excerpt %}{{ page.excerpt | strip_html | strip_newlines | truncate: 160 }}{% else %}{{ site.description }}{% endif %}">
	<meta property="og:type" content="{% if page.layout == 'post' %}article{% else %}website{% endif %}">
	<meta property="og:url" content="{{ page.url | replace:'index.html','' | prepend: site.baseurl | prepend: site.url }}"/>
	<meta property="og:image" content="{{ page.image | default: site.picture | relative_url | prepend: site.url }}"/>
    {% include favicon.html %}

    <link rel="canonical" href="{{ site.url }}{{ page.url | replace:'index.html','' }}">
    <!--<link rel="alternate" type="application/rss+xml" title="{{ site.title }}" href="{{ site.url }}{{ "/feed.xml" }}" />-->
    <link rel="alternate" type="application/rss+xml" href="{{ site.url }}/feed.xml" title="{{ site.title }} Feed">
    <style>
    {% capture scss_sheet %}{% include style.scss %}{% endcapture %}
    {{ scss_sheet | scssify }}
    </style>
	
</head>
<body>

    <div class="site-shell">
        {% include nav.html %}
        <main class="site-main {{ page.title | slugify }}{% if page.layout == 'post' %} post{% endif %}">
            {{ content }}
        </main>
        {% include footer.html %}
    </div>

</body>
</html>
