---
layout: page
title: Home
---
<section class="home-hero">
    <h1>Lucas Jang</h1>
</section>

<section class="category-grid" aria-label="카테고리">
    {% for category in site.data.categories %}
    <article class="category-card">
        <a href="{{ '/category/' | append: category.slug | append: '/' | relative_url }}">
            <div class="category-card-image">
                <img src="{{ category.image | relative_url }}" alt="{{ category.name }}" style="object-position: {{ category.image_position }}">
            </div>
            <div class="category-card-label">
                <h2>{{ category.name }}</h2><span aria-hidden="true">→</span>
            </div>
        </a>
    </article>
    {% endfor %}
</section>
